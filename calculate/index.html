<!DOCTYPE HTML>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../main.css">
	<link rel="stylesheet" href="../media.css">
	<link rel="stylesheet" href="style.css">
	<title>CHORA PRACTICE – Калькулятор ткани</title>
	<link rel="icon" type="image/png" href="../favicon.png">
</head>

<body>

<div class="calc">
	<h1>калькулятор ткани</h1>

	<div class="field">
		<label>Тип объекта</label>
		<div class="type-toggle" id="typeToggle">
			<button type="button" data-type="table" class="active">Стол</button>
			<button type="button" data-type="round">Круглый</button>
			<button type="button" data-type="backdrop">Бэкдроп</button>
			<button type="button" data-type="walls">Стены</button>
			<button type="button" data-type="roof">Крыша</button>
		</div>
	</div>

	<div class="field hidden" id="roofLayoutField">
		<label>Полосы крыши</label>
		<div class="type-toggle" id="roofLayoutToggle">
			<button type="button" data-roof="parallel" class="active">Параллельно</button>
			<button type="button" data-roof="center">Из центра</button>
		</div>
	</div>

	<div class="field hidden" id="perSideField">
		<label for="perSide">Полосок на сторону <span class="hint" data-tip="Для крыши из центра ширина полоски не важна — задаём число полос на одну сторону. Итого × 4 стороны. В режиме «петлёй» одна полоса идёт до края и обратно к центру, поэтому полос вдвое меньше, но каждая вдвое длиннее.">?</span></label>
		<div class="input-wrap">
			<input type="text" id="perSide" inputmode="numeric" value="4">
			<span class="input-unit">шт</span>
		</div>
	</div>

	<div class="field drape-field hidden" id="loopField">
		<label>Полоса петлёй</label>
		<button type="button" id="loopToggle" class="switch" role="switch" aria-checked="false">
			<span class="switch-knob"></span>
		</button>
	</div>

	<div class="field drape-field" id="drapeField">
		<label>Драпировка</label>
		<button type="button" id="drapeToggle" class="switch active" role="switch" aria-checked="true">
			<span class="switch-knob"></span>
		</button>
	</div>

	<div class="row-group">
		<div class="field hidden" id="diameterField">
			<label for="diameter">Диаметр <span class="hint" data-tip="Диаметр стола. Кладём два полотна накрест; каждое = диаметр + 2 высоты + 2 спуска (свес и запас с обеих сторон). При драпировке полотен вдвое больше.">?</span></label>
			<div class="input-wrap">
				<input type="text" id="diameter" inputmode="decimal">
				<span class="input-unit">м</span>
			</div>
		</div>

		<div class="field" id="widthField">
			<label for="width">Ширина <span class="hint" data-tip="Что назвать шириной, а что длиной — не важно: большая сторона идёт на число полосок, меньшая — на длину полоски.">?</span></label>
			<div class="input-wrap">
				<input type="text" id="width" min="0" step="0.01" inputmode="decimal">
				<span class="input-unit">м</span>
			</div>
		</div>

		<div class="field" id="lengthField">
			<label for="length">Длина <span class="hint" data-tip="Что назвать шириной, а что длиной — не важно: большая сторона идёт на число полосок, меньшая — на длину полоски.">?</span></label>
			<div class="input-wrap">
				<input type="text" id="length" min="0" step="0.01" inputmode="decimal">
				<span class="input-unit">м</span>
			</div>
		</div>

		<div class="field" id="heightField">
			<label for="height">Высота <span class="hint" data-tip="Высота конструкции. У стола — свес по бокам (×2), у крыши — подъём центра (появляются скаты под углом, длина ткани растёт), у стен и бэкдропа — высота полотна.">?</span></label>
			<div class="input-wrap">
				<input type="text" id="height" min="0" step="0.01" inputmode="decimal">
				<span class="input-unit">м</span>
			</div>
		</div>

		<div class="field" id="spuskField">
			<label for="spusk">Спуск <span class="hint" data-tip="Запас ткани сверх высоты — на пол, подгиб или «лужу». У стола добавляется 2 раза, у бэкдропа — 1 раз.">?</span></label>
			<div class="input-wrap">
				<input type="text" id="spusk" min="0" step="0.01" inputmode="decimal">
				<span class="input-unit">м</span>
			</div>
		</div>
	</div>

	<div class="row-group">
		<div class="field" id="stripWidthField">
			<label for="stripWidth">Ширина полоски <span class="hint" data-tip="На неё делится габарит, чтобы получить число полос: чем шире полоска, тем меньше полос.">?</span></label>
			<div class="input-wrap">
				<input type="text" id="stripWidth" min="0.01" step="0.01" value="1.4" inputmode="decimal">
				<span class="input-unit">м</span>
			</div>
			<div class="presets" id="stripPresets">
				<button type="button" data-val="1.4">1.4 м</button>
				<button type="button" data-val="2.8">2.8 м</button>
				<button type="button" data-val="3.0">3.0 м</button>
			</div>
		</div>

		<div class="field">
			<label for="price">Стоимость</label>
			<div class="input-wrap wide">
				<input type="text" id="price" min="0" step="0.01" value="2.6" inputmode="decimal">
				<span class="input-unit">€/м</span>
			</div>
			<div class="presets" id="pricePresets">
				<button type="button" data-val="2.6">2.6 €</button>
				<button type="button" data-val="8">8 €</button>
			</div>
		</div>
	</div>

	<div class="field">
		<label>Рулоны ткани — длина и количество <span class="hint" data-tip="Полоски раскладываются по рулонам так, чтобы задействовать меньше рулонов и оставить минимум обрезков и один длинный полезный остаток.">?</span></label>
		<div id="rollRows"></div>
		<button type="button" id="addRoll" class="add-roll">+ вариант рулона</button>
	</div>

	<div class="diagram" id="diagram"></div>

	<div class="result" id="result">
		<div class="result-grid">
			<div class="rescol">
				<span class="reslabel">Полосок</span>
				<span class="resval" id="rStrips">—</span>
			</div>
			<span class="resop">×</span>
			<div class="rescol">
				<span class="reslabel">Длина полоски</span>
				<span class="resval" id="rStripLen">—</span>
			</div>
			<span class="resop">=</span>
			<div class="rescol">
				<span class="reslabel">Всего</span>
				<span class="resval" id="rTotalMeters">—</span>
			</div>
			<span class="resop">=</span>
			<div class="rescol cost">
				<span class="reslabel">Стоимость</span>
				<span class="resval" id="rCost">—</span>
			</div>
		</div>
		<div class="muted hidden" id="rFormula"></div>
		<div id="rollPlan"></div>
	</div>
</div>

<script src="script.js"></script>

</body>
</html>
